appId: dev.zapret.mobile
name: Zapret Mobile selected-app routing
---
- launchApp
- assertVisible: "App routing"
- tapOn: "Route selected apps only"
- assertVisible: "No apps selected.*"
- tapOn: "CHOOSE APPS"
- extendedWaitUntil:
    visible: "Apps routed through Zapret"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Zapret Test Client.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Zapret Test Client.*"
- tapOn: "SAVE"
- extendedWaitUntil:
    visible: "Selected apps: 1.*"
    timeout: 10000
- stopApp
- launchApp
- assertVisible: "Selected apps: 1.*"
